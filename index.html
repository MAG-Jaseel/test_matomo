    <!-- Matomo -->
    <script>
      var _paq = (window._paq = window._paq || []);
      _paq.push(["setExcludedReferrers", ["0"]]);
      _paq.push(["trackPageView"]);
      _paq.push(["enableLinkTracking"]);
      (function () {
        var u = "//nordhavenroyale.traccountable.com/";
        _paq.push(["setSessionCookieTimeout", 60]);
        _paq.push(['requireConsent']);
        _paq.push(["setTrackerUrl", u + "matomo.php"]);
        _paq.push(["setSiteId", "6"]);
        var d = document,
          g = d.createElement("script"),
          s = d.getElementsByTagName("script")[0];
        g.async = true;
        g.src = u + "matomo.js";
        s.parentNode.insertBefore(g, s);
      })();
      (function () {
        var s = document.createElement("script");
        s.src = "https://provision.traccountable.com/cdn/st.min.js";
        s.onload = function () {
          stTrackClick(
            "id",
            "contact-form-button",
            "Form",
            "Click",
            "Contact Form Button",
            undefined,
          );
          stTrackView(
            "id",
            "contact-form",
            "Form",
            "View",
            "Contact Form",
            0.5,
          );
        };
        document.head.appendChild(s);
      })();
    </script>
